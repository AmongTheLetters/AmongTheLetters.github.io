name: Keep the Supabase project awake

# Free Supabase projects pause after a week with no traffic. This reads the public free list twice a week.
# It only runs once SUPABASE_URL and SUPABASE_ANON_KEY are set as repository Variables.
on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/opportunities?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -o /dev/null && echo awake
