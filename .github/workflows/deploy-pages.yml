name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          # Public values only, set under Settings, Secrets and variables, Actions, Variables.
          # While SUPABASE_URL is empty the site builds with accounts switched off.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_STRIPE_LINK_MONTHLY: ${{ vars.STRIPE_LINK_MONTHLY }}
          VITE_STRIPE_LINK_ANNUAL: ${{ vars.STRIPE_LINK_ANNUAL }}
          VITE_STRIPE_PORTAL: ${{ vars.STRIPE_PORTAL }}
          VITE_GOOGLE_SIGNIN: ${{ vars.GOOGLE_SIGNIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
